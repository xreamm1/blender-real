name: Publish prebuilt Blender preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and unpack the CDN release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download preview-1 --repo xreamm1/blender-cdn --pattern blender-real-preview.tar.gz
          echo 'eeff91dedf11a8eb107e2a41fa79d50eb1389a2fd62fcf2d76675579601ecd2c  blender-real-preview.tar.gz' | sha256sum --check
          mkdir dist
          tar -xzf blender-real-preview.tar.gz -C dist
          test -s dist/index.html
          test -s dist/blender.wasm.zst
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the browser preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
