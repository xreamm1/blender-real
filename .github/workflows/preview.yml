name: Publish prebuilt Blender preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify and unpack the CDN release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download preview-1 --repo xreamm1/blender-cdn --pattern blender-real-preview.tar.gz; then
            echo 'eeff91dedf11a8eb107e2a41fa79d50eb1389a2fd62fcf2d76675579601ecd2c  blender-real-preview.tar.gz' | sha256sum --check
            mkdir dist
            tar -xzf blender-real-preview.tar.gz -C dist
          else
            gh api repositories/1285398317/releases/assets/658277106 \
              --header 'Accept: application/octet-stream' > upstream-preview.tar.gz
            python3 prepare-preview.py upstream-preview.tar.gz dist
          fi
          test -s dist/index.html
          test -s dist/blender.wasm.zst
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the browser preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
