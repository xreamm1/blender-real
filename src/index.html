<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blender Real by xreamm</title>
    <meta
      name="description"
      content="Access Blender online, entirely on the web. The real Blender interface with no installation required. Compiled to WebAssembly, rendering on a WebGPU backend."
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />

    <!-- Open Graph / Facebook / Slack / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="xreamm" />
    <meta property="og:title" content="Blender in the Browser" />
    <meta
      property="og:description"
      content="Access Blender online, entirely on the web. The real Blender interface with no installation required. Compiled to WebAssembly, rendering on a WebGPU backend."
    />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blender in the Browser" />
    <meta
      name="twitter:description"
      content="Access Blender online, entirely on the web. The real Blender interface with no installation required. Compiled to WebAssembly, rendering on a WebGPU backend."
    />

    <link rel="stylesheet" href="/src/styles.css" />

  </head>
  <body>
    <section id="splash" aria-live="polite">
      <main class="stage">
        <div id="splash-shell" class="stage-inner" data-phase="loading">
          <h1 class="sr-only">Blender in the Browser</h1>
          <div class="loader-logos" role="img" aria-label="Blender × WebAssembly">
          <svg class="loader-blender loader-icon" viewBox="0 0 24 24" aria-hidden="true" shape-rendering="crispEdges">
            <path fill="#ed8124" d="M10 3h3v1h2v1h1v1h2v1h1v1h2v2h1v2h1v6h-1v2h-2v1h-2v1h-6v-1h-2v-1H8v-2H7v-2H5v1H3v1H1v-3h2v-1h1v-1h2v-1h1v-1H3V8h11V7h-2V6h-1V5h-1z" />
            <path fill="#bd5019" d="M8 17h2v2h2v1h6v-1h2v-1h2v2h-2v1h-2v1h-6v-1h-2v-1H8zM2 16h2v-1h2v1H5v1H3v1H1v-1h1z" />
            <path fill="#ffb246" d="M10 3h3v1h2v1h1v1h-3V5h-2V4h-1zM3 8h11v1H3zM11 10h2v1h-2z" />
            <path fill="#ffedd2" d="M13 10h6v1h2v2h1v4h-1v2h-2v1h-6v-1h-2v-2h-1v-4h1v-2h2z" />
            <path fill="#2376ae" d="M14 12h4v1h2v4h-1v1h-1v1h-4v-1h-2v-2h-1v-2h1v-1h2z" />
            <path fill="#174d79" d="M19 15h1v2h-1v1h-1v1h-4v-1h-2v-2h1v1h2v1h2v-1h2z" />
            <path fill="#56b4dd" d="M14 12h3v1h-2v1h-2v-1h1z" />
          </svg>
          <svg class="loader-cross" viewBox="0 0 7 7" aria-hidden="true" shape-rendering="crispEdges">
            <path fill="#e9dfcf" d="M0 0h1v1h1v1h1v1h1V2h1V1h1V0h1v1H6v1H5v1H4v1h1v1h1v1h1v1H6V6H5V5H4V4H3v1H2v1H1v1H0V6h1V5h1V4h1V3H2V2H1V1H0z" />
          </svg>
          <svg class="loader-wasm loader-icon" viewBox="0 0 24 24" aria-hidden="true" shape-rendering="crispEdges">
            <path fill="#654ff0" d="M2 2h8v3h1v1h2V5h1V2h8v20H2z" />
            <path fill="#4934bc" d="M2 20h18V2h2v20H2z" />
            <path fill="#a99aff" d="M2 2h8v1H3v17H2zM14 2h6v1h-6z" />
            <path fill="#fff4df" d="M4 11h2v6h1v-4h2v4h1v-6h2v8h-3v-2H7v2H4zM15 11h4v2h1v6h-2v-3h-3v3h-2v-6h2z" />
            <path fill="#654ff0" d="M16 13h1v1h-1z" />
          </svg>
          </div>

          <div id="stage-card" class="launch-panel" data-phase="loading">
            <div class="panel-loading" aria-label="Loading Blender">
              <div class="progress-track" role="progressbar" aria-label="Startup progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="progress-fill" class="progress-fill"></div>
              </div>
              <div class="progress-meta">
                <span id="progress-phase" class="sr-only">Preparing</span>
                <span id="progress-percent">0%</span>
              </div>
              <p id="splash-status" class="splash-status">Preparing Blender…</p>
            </div>

            <div class="panel-ready" aria-label="Launch">
              <button id="start-btn" type="button" class="start-btn" disabled>Launch Blender</button>
              <p id="webgpu-note" class="jspi-note" hidden></p>
            </div>

            <!-- GPU status: populated early (before downloads finish) by the
                 adapter probe. Shown only when WebGPU is missing or falls back
                 to a software renderer; the acknowledgement checkbox gates the
                 Launch button in that case. -->
            <div id="gpu-warning" class="gpu-warning" hidden>
              <p id="gpu-warning-text" class="gpu-warning-text"></p>
              <label id="gpu-ack-row" class="gpu-ack-row" hidden>
                <input type="checkbox" id="gpu-ack" />
                <span>Launch anyway with software rendering — expect it to be extremely slow.</span>
              </label>
            </div>
          </div>

          <details class="startup-console" open>
            <summary>Startup log</summary>
            <div id="console-output" class="console-box" role="log" aria-label="Startup console output"></div>
          </details>
        </div>
      </main>
      <a class="loader-credit" href="https://github.com/xreamm1/blender-real">xreamm</a>
    </section>
    <canvas id="canvas" width="1536" height="864" tabindex="0"></canvas>
    <details id="browser-projects" hidden>
      <summary>Browser projects</summary>
      <label>Import .blend <input id="project-import" type="file" accept=".blend" disabled /></label>
      <button id="project-open" type="button" disabled>Open</button>
      <button id="project-save" type="button" disabled>Save as</button>
      <p id="project-status" role="status">Opening browser storage…</p>
    </details>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
